<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- The iOS icon: icon.svg's art, full bleed. iOS draws its own rounded corners and refuses an
       icon with transparency, so the blue runs to the edges and the glyph keeps the Mac icon's
       proportion of the square (470 of 824): 584px here, centred at (1024 - 584) / 2 = 220. -->
  <rect width="1024" height="1024" fill="#3478f6"/>
  <g transform="translate(220,220) scale(24.3333)"
     fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
    <path d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z" />
  </g>
</svg>
