<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;">
    <title>Settings</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="settings.css">
    <link rel="stylesheet" href="mobile.css">
  </head>
  <!-- The Mac's Settings panel, shown in a frame over the app. settings-shim.js lends it the
       app's bridge before settings.js asks for one. -->
  <body class="settings mobile">
    <div id="window-title"></div>
    <nav id="tabs"></nav>
    <div id="panel"></div>
    <script src="settings-shim.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
